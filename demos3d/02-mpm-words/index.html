<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLS-MPM 文字が素材になる</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #2b2436; overflow: hidden; font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif; }
  #wrap { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform: translate(-50%,-50%); transform-origin: center; }
  canvas { display: block; width: 1280px; height: 720px; border-radius: 6px; }
  .label { position: absolute; left: 24px; top: 22px; background: rgba(255,255,255,.9); border: 4px solid #4a3b5c; border-radius: 18px; padding: 10px 20px; color: #4a3b5c; }
  .label b { font-size: 30px; display: block; }
  .label span { font-size: 17px; }
  .cap { position: absolute; transform: translateX(-50%); background: #fff; border: 3px solid #4a3b5c; border-radius: 99px; padding: 4px 16px; font-size: 17px; color: #4a3b5c; white-space: nowrap; font-weight: 800; }
  #msg { position: absolute; left: 0; right: 0; top: 110px; display: grid; place-items: center; color: #fff; font-size: 22px; text-align: center; padding: 40px; }
</style>
<body>
<div id="wrap">
  <canvas id="stage" width="1280" height="720"></canvas>
  <div class="label"><b>文字が素材になる（MLS-MPM）</b><span>文字を約2万個の粒にして、素材ごとの物理で動かす／クリックでやり直し</span></div>
  <div id="msg">読み込み中…</div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
