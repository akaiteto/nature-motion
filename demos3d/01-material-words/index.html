<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D 素材の言葉</title>
<style>
  html, body { margin: 0; height: 100%; background: #2b2436; overflow: hidden; font-family: "Noto Sans CJK JP", "Hiragino Sans", "Yu Gothic", sans-serif; }
  #wrap { position: absolute; left: 50%; top: 50%; width: 1280px; height: 720px; transform-origin: 0 0; }
  canvas { display: block; border-radius: 6px; }
  .label { position: absolute; left: 24px; top: 22px; background: rgba(255,255,255,.88); border: 4px solid #4a3b5c; border-radius: 18px; padding: 10px 20px; color: #4a3b5c; }
  .label b { font-size: 30px; display: block; }
  .label span { font-size: 18px; }
  .cap { position: absolute; bottom: 18px; transform: translateX(-50%); background: #fff; border: 3px solid #4a3b5c; border-radius: 99px; padding: 4px 14px; font-size: 15px; color: #4a3b5c; white-space: nowrap; font-weight: 700; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 22px; }
</style>
<body>
<div id="wrap">
  <div id="loading">読み込み中…</div>
  <div class="label"><b>素材になる言葉</b><span>言葉ごとに重さ・弾み・壊れ方がちがう／クリックでボール</span></div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
} }
</script>
<script type="module" src="main.js"></script>
</body>
</html>
