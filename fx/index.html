<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>関数でかわいく動く文字 — 10本 ＋ 擬音の自然現象 4本</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap');
  body { margin: 0; background: #fff6fb; color: #4a3b5c; font-family: "M PLUS Rounded 1c", sans-serif; }
  header { padding: 40px 6vw 10px; }
  h1 { font-size: clamp(26px, 4vw, 44px); margin: 0 0 8px; }
  header p { margin: 0; opacity: .8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; padding: 24px 6vw 60px; }
  .card { background: #fff; border: 4px solid #4a3b5c; border-radius: 22px; overflow: hidden; box-shadow: 0 8px 0 rgba(74,59,92,.15); }
  .card a.view { display: block; color: inherit; text-decoration: none; }
  .card img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; border-bottom: 4px solid #4a3b5c; }
  .card .t { padding: 14px 18px 4px; font-weight: 800; font-size: 19px; }
  .card .f { padding: 0 18px 8px; font-size: 14px; opacity: .8; }
  .card .src { display: inline-block; margin: 0 18px 16px; font-size: 13px; color: #b06a95; }
</style>
<body>
<header>
  <h1>関数でかわいく動く文字</h1>
  <p>名前のついた関数群（ペナー、キレス、レヴィン、名前つき曲線、フーリエ、ばね、ノイズ、アトラクタ）で、文字を動かす10本（01〜10、動画に採用）。下の「参考」は3D版の試作（11〜27、動画には使わない）。画面は 1920×1080、ループ再生。</p>
</header>
<div class="grid" id="grid"></div>
<header style="padding-top:0"><h1 style="font-size:clamp(22px,3vw,34px)">擬音の文字群で自然現象（4本・採用）</h1>
<p>小さな擬音の文字をたくさん集めて、炎・煙・爆発・しずく・燃える紙・雨・ほたる・泡を作る。群の動き（物理や数式）＋ 1文字ずつの演出（温度や速さで文字・色・形が変わる）。</p></header>
<div class="grid" id="grid-onoma"></div>
<details style="padding:0 6vw 30px"><summary style="cursor:pointer;font-weight:800">参考：擬音の試作（煙・しずく・ほたる・泡、不採用）</summary><div class="grid" id="grid-onoma-x" style="padding:20px 0 0;opacity:.75"></div></details>
<details style="padding:0 6vw 60px"><summary style="cursor:pointer;font-weight:800">参考：3D版の試作（11〜27、不採用）</summary><div class="grid" id="grid3d" style="padding:20px 0 0;opacity:.75"></div></details>
<script>
const items = [
  ['01-fourier-maru', 'フーリエの円で描く「かわいい」', 'フーリエ級数（エピサイクル）／円を減らすと丸文字に'],
  ['02-attractor-swarm', 'アトラクタで舞う文字', 'ローレンツアトラクタ → ばね（二次の動き）'],
  ['03-rose-bloom', 'バラ曲線で咲く「さくら」', 'バラ曲線 ＋ 二重指数シグモイド（Levin）'],
  ['04-bounce-title', 'バウンスで落ちるタイトル', 'easeOutBounce（Penner）＋ cubicPulse（Quilez）'],
  ['05-anagram-jump', '放物線で並び替わる文字', 'parabola（Quilez）＋ easeOutBack'],
  ['06-wave-line', 'ウェーブが通る一行', 'cubicPulse（Quilez）＋ Undertale 風の表示'],
  ['07-elastic-pop', 'ぷるん登場', 'easeOutElastic（Penner）＋ expImpulse'],
  ['08-superformula-heart', '星から花からハートへ', 'スーパーフォーミュラ（Gielis）＋ ハートの曲線'],
  ['09-spring-drag', 'ひっぱるとぷるん', 'ばね：二次の動き（t3ssel8r）'],
  ['10-noise-wind', 'ふわふわと風', 'パーリンノイズ ＋ カールノイズ ＋ ばね'],
  ['11-puffy-balloon', 'ぷっくり風船文字', '押し出し＋大きなベベル ／ easeOutElastic ／ ばね'],
  ['12-anamorphic', '見る角度で読める文字', 'アナモルフォーシス：光線上のブロック ／ カメラで着地'],
  ['13-text-knot', '結び目を流れる文字', '文字の帯テクスチャ ＋ トーラス結び目 ／ UV を流す'],
  ['14-domino-twist', 'ドミノ回転する立体文字', '押し出し文字 ＋ easeInOutBack の時間差'],
  ['15-voxel-build', 'ブロックで積み上がる文字', 'InstancedMesh ＋ easeOutBounce ＋ cubicPulse'],
  ['16-css-layers', 'CSSだけの立体文字', 'translateZ で 28 枚重ねる（three.js なし）'],
  ['17-text-tunnel', '文字のトンネル', '円周に並べた文字の環 ＋ カメラの前進'],
  ['18-twist-bend', '【変形】ねじる・曲げる', 'ツイスト／ベンド（Barr 1984・Blender シンプル変形）'],
  ['19-taper-stretch', '【変形】細める・伸ばす', 'テーパー／ストレッチ ＋ ばね'],
  ['20-sdf-mercury', '【距離関数】水銀のようにくっつく', 'なめらかな合体 smin ＋ レイマーチング（Quilez）'],
  ['21-sdf-carve-onion', '【距離関数】くり抜きと殻', '引き算・共通部分・殻（オニオン）'],
  ['22-material-catalog', '【素材】素材カタログ', '透過＋分散／薄膜／異方性／シーン（MeshPhysicalMaterial）'],
  ['23-jelly-glass', '【素材】ゼリーの文字', '透過＋厚み＋吸収の色 ＋ ばね'],
  ['24-neon-bloom', '【後処理】ネオンの文字', 'UnrealBloomPass ＋ AfterimagePass'],
  ['25-filter-switch', '【後処理】フィルターの着せ替え', '網点・ピクセル化・ドット・フィルム・グリッチ'],
  ['26-dolly-zoom', '【カメラ】めまいショット', 'ドリーズーム：近づきながら画角を広げる'],
  ['27-rack-focus', '【カメラ】ピント送りとホイップパン', 'BokehPass ＋ AfterimagePass'],
];
const onoma = [
  ['o1-fire', 'めらめら（炎）', '流体（Stable Fluids）＋ 温度で ぼう→めら→ゆら→ぷす'],
  ['o2-smoke', 'もくもく（煙）', 'ふくらむ煙のかたまり ＋ カールノイズ → 文字へ arrive'],
  ['o3-explosion', 'ドカーン（爆発）', '指数の減速 ＋ ため・閃光・スロー・手ぶれ'],
  ['o4-drop', 'ぽたっ（しずく）', 'しずく形の席へばね ／ 王冠のはね ／ 減衰する波紋'],
  ['o5-paper-burn', 'じりじり（紙が燃える）', '燃える時刻＝距離÷速さ＋ノイズ ／ 火の粉と灰'],
  ['o6-rain', 'ぽつぽつ→しとしと→ざあざあ（雨）', '数と速さを段階で上げる ／ 速いほど縦に伸びる'],
  ['o7-firefly', 'ぴか（ほたる）', '蔵本モデル：光がだんだんそろう → 文字へ'],
  ['o8-bubble', 'ぶくぶく（泡）', '大きいほど速く浮く ／ くっつくと r=√(r1²+r2²)'],
];
const card = ([d, t, f]) => `
  <div class="card"><a class="view" href="${d}/index.html"><img src="thumbs/${d}.jpg" alt=""><div class="t">${d.slice(0, 2)}　${t}</div><div class="f">${f}</div></a>
  <a class="src" href="${d}/main.js">ソース（main.js）</a></div>`
const html = items => items.map(card).join('');
document.getElementById('grid').innerHTML = html(items.slice(0, 10));
const keep = ['o1-fire', 'o3-explosion', 'o5-paper-burn', 'o6-rain'];
document.getElementById('grid-onoma').innerHTML = html(onoma.filter(o => keep.includes(o[0])));
document.getElementById('grid-onoma-x').innerHTML = html(onoma.filter(o => !keep.includes(o[0])));
document.getElementById('grid3d').innerHTML = html(items.slice(10));
</script>
</body>
</html>
